<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/blog-post.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container mt-5">
        <div class="row">
            <article class="col-md-9">
                <header id="blog-post-header"></header>
                <div id="blog-post-content"></div>
                <hr>
                <section id="comment-section">
                    <h3>Comments</h3>
                    <div id="comments-container"></div>
                    <form id="comment-form">
                        <h4>Leave a Comment</h4>
                        <div class="mb-3">
                            <label for="comment-name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="comment-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="comment-text" class="form-label">Comment</label>
                            <textarea class="form-control" id="comment-text" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </section>
            </article>
            <aside class="col-md-3">
                <div id="sidebar">
                    <section id="categories">
                        <h4>Categories</h4>
                        <ul id="category-list"></ul>
                    </section>
                    <hr>
                    <section id="latest-posts">
                        <h4>Latest Posts</h4>
                        <ul id="latest-posts-list"></ul>
                    </section>
                </div>
            </aside>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="js/blog-post.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/nav-script.js"></script>
</body>
</html>
