                pricing: { heading: "Quality learning at an affordable price", paragraph: "Investing in your child’s confidence.", price_btn: "Enroll Now @ 1699/-", image: "https://i.imgur.com/8Fk7L3E.png" },
                testimonials: [{ text: "Great confidence booster!", name: "Anita Sharma", role: "Parent" }]
            },
            'ai_coding': { 
                name: "AI & Coding Workshop",
                hero: { title: "Explore the Future with <span>AI & Coding</span>", desc: "Practical workshops on AI fundamentals, programming, and robotics.", image: "https://i.imgur.com/0bWwK3r.png" },
                learning_cards: [{ icon: '🤖', title: 'AI Fundamentals', class: 'blue' }],
                stats: [{ icon: '🏆', count: '5+', label: 'Projects Completed' }],
                levels: [{ h3: '01', details: ['Class : 20hrs', 'Projects : 2', 'Language : Scratch'], button: 'Explorer Level', class: 'beginner' }],
                feature_cards: [{ icon_url: "https://cdn-icons-png.flaticon.com/512/3135/3135755.png", title: "Level 1 Focus", list: ["Block Coding", "Basic Loops"] }],
                pricing: { heading: "Quality learning at an affordable price", paragraph: "Investing in future tech careers.", price_btn: "Enroll Now @ 1999/-", image: "https://i.imgur.com/8Fk7L3E.png" },
                testimonials: [{ text: "My daughter built her first AI model!", name: "Kiran V.", role: "Parent, Tech" }]
            }
        };

        // --- HTML GENERATION HELPERS (Hardened mapToHTML) ---
        function mapToHTML(dataArray, type) {
            const data = dataArray ?? []; 
            if (!Array.isArray(data) || data.length === 0) {
                 return ``; 
            }
            
            switch (type) {
                case 'learning_cards':
                    return data.map(card => `
                        <div class="learning-card ${card.class}">
                            <div class="icon">${card.icon}</div>
                            <h3>${card.title}</h3>
                        </div>
                    `).join('');
                case 'stats':
                    return data.map(stat => `
                        <div class="stat-item">
                            <div class="stat-icon">${stat.icon}</div>
                            <h3>${stat.count}</h3>
                            <p>${stat.label}</p>
                        </div>
                    `).join('');
                case 'levels':
                    // **CRITICAL FIX HERE**
                    return data.map(level => {
                        const detailsArray = level.details && Array.isArray(level.details) ? level.details : [];
                        return `
                            <div class="level-card ${level.class}">
                                <h3>${level.h3 || 'N/A'}</h3>
                                ${detailsArray.map(detail => `<p>${detail}</p>`).join('')}
                                <button>${level.button || 'Explore'}</button>
                            </div>
                        `;
                    }).join('');
                case 'feature_cards':
                    return data.map(feature => `
                        <div class="feature-card">
                            <div class="icon-circle">
                                <img src="${feature.icon_url || 'https://via.placeholder.com/35'}" alt="${feature.title} Icon">
                            </div>
                            <h3>${feature.title}</h3>
                            <ul>
                                ${feature.list.map(item => `<li>${item}</li>`).join('')}
                            </ul>
                            <button class="download-btn">Download <span>→</span></button>
                        </div>
                    `).join('');
                case 'testimonials':
                    return data.map(t => `
                        <div class="testimonial-card">
                            <p class="testimonial-text">${t.text}</p>
                            <div>
                                <p class="testimonial-name">${t.name}</p>
                                <p class="testimonial-role">${t.role}</p>
                            </div>
                        </div>
                    `).join('');
                default:
                    return '';
            }
        }

        function generateDynamicHTML(data) {
            // Merge fetched data with safe defaults to ensure structure is complete
            const courseData = { 
                ...SAFE_COURSE_DEFAULTS, 
                ...data,
                hero: { ...SAFE_COURSE_DEFAULTS.hero, ...(data?.hero) },
                pricing: { ...SAFE_COURSE_DEFAULTS.pricing, ...(data?.pricing) }
            };

            document.getElementById('page-title').textContent = courseData.name;
            
            return `
                <section class="hero">
                    <div class="hero-content">
                        <h1>${courseData.hero.title}</h1>
                        <p>${courseData.hero.desc}</p>
                    </div>
                    <div class="hero-image">
                        <img src="${courseData.hero.image}" alt="${courseData.name} Hero Image">
                    </div>
                </section>

                <section class="learning-section">
                    <h2>What your child will learn</h2>
                    <div class="learning-grid">${mapToHTML(courseData.learning_cards, 'learning_cards')}</div>
                </section>
                
                <section class="stats-section">
                    <div class="stats-container">${mapToHTML(courseData.stats, 'stats')}</div>
                </section>

                <section class="course-levels">
                    <h2>Start your confidence boosting journey</h2>
                    <div class="levels-container">${mapToHTML(courseData.levels, 'levels')}</div>
                </section>

                <section class="educate-features">
                    <h2>Check Out Educate Features Win<br>Any Exam</h2>
                    <div class="features-container">${mapToHTML(courseData.feature_cards, 'feature_cards')}</div>
                </section>

                <section class="pricing-section">
                    <div class="pricing-content">
                        <h2>${courseData.pricing.heading}</h2>
                        <p>${courseData.pricing.paragraph}</p>
                        <div class="pricing-buttons">
                            <button class="pricing-btn-primary">${courseData.pricing.price_btn}</button>
                            <button class="pricing-btn-secondary">Download <span>→</span></button>
                        </div>
                    </div>
                    <div class="pricing-image">
                        <img src="${courseData.pricing.image}" alt="Pricing Illustration">
                    </div>
                </section>

                <section class="testimonials-section">
                    <h2>Creating A Community Of Life Long Learners.</h2>
                    <div class="testimonials-container">${mapToHTML(courseData.testimonials, 'testimonials')}</div>
                </section>
            `;
        }

        // --- DATA NORMALIZATION FUNCTION ---
        function normalizeFirebaseData(fetchedData) {
            if (!fetchedData) return null;

            const currentFallback = FALLBACK_DATA[courseId];

            const normalized = {
                // 1. Rename and Map Top-Level Fields
                name: fetchedData.title || 'Course Title Missing', // Use 'title' for 'name'
                learning_cards: fetchedData.learningOutcomes || [], // Map 'learningOutcomes' to 'learning_cards'
                stats: fetchedData.stats || [],
                levels: fetchedData.confidenceJourney || [], // Map 'confidenceJourney' to 'levels'
                
                // 2. Map Nested 'hero' Fields
                hero: {
                    title: fetchedData.title || SAFE_COURSE_DEFAULTS.hero.title,
                    desc: fetchedData.tagline || fetchedData.description || SAFE_COURSE_DEFAULTS.hero.desc,
                    image: fetchedData.image || SAFE_COURSE_DEFAULTS.hero.image,
                },

                // 3. Map Nested 'pricing' Fields
                pricing: {
                    heading: fetchedData.leftRight?.heading || SAFE_COURSE_DEFAULTS.pricing.heading,
                    paragraph: fetchedData.leftRight?.paragraph || SAFE_COURSE_DEFAULTS.pricing.paragraph,
                    image: fetchedData.leftRight?.image || SAFE_COURSE_DEFAULTS.pricing.image,
                    price_btn: currentFallback?.pricing?.price_btn || SAFE_COURSE_DEFAULTS.pricing.price_btn, 
                },

                // 4. Missing sections default to empty arrays/objects (can pull from fallback if needed)
                // *** FIX APPLIED HERE: Prioritize Firebase data (fetchedData.feature_cards) over fallback ***
                feature_cards: fetchedData.feature_cards || currentFallback?.feature_cards || [], 
                testimonials: currentFallback?.testimonials || []
            };
            
            return normalized;
        }

        // --- CORE DATA FETCHING (Using Normalization) ---
        async function fetchCourseData(courseId) {
            const contentArea = document.getElementById('dynamic-content-area');
            let courseData = null;
            
            try {
                const snapshot = await db.ref('courses/' + courseId).once('value');
                const firebaseResult = snapshot.val();
                
                console.log(`[DEBUG] Requested ID: ${courseId}`);
                console.log(`[DEBUG] Firebase Raw Result:`, firebaseResult); 
                
                if (firebaseResult) {
                    // *** CRITICAL STEP: Normalize the data structure ***
                    courseData = normalizeFirebaseData(firebaseResult);
                    console.log(`[DEBUG] Successfully fetched and normalized live data.`);
                } else if (FALLBACK_DATA[courseId]) {
                    console.warn(`Data for ${courseId} not found in Firebase. Using local fallback.`);
                    courseData = FALLBACK_DATA[courseId];
                } else {
                    console.error(`No data found in Firebase or local fallback for ID: ${courseId}.`);
                    courseData = SAFE_COURSE_DEFAULTS; 
                    courseData.name = `Course ID '${courseId}' Not Found.`;
                }

            } catch (error) {
                console.error("Firebase connection or SDK error. Falling back to local data.", error);
                courseData = FALLBACK_DATA[courseId] || SAFE_COURSE_DEFAULTS;
            }
            
            // 4. Render the chosen data
            const dynamicHTML = generateDynamicHTML(courseData);
            contentArea.innerHTML = dynamicHTML;
        }

        // --- INITIALIZATION ---
        
        fetchCourseData(courseId);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/nav-script.js"></script>
