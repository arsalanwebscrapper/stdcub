<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artificial Intelligence Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container">
        <section class="hero">
            <div class="row align-items-center">
                <div class="col-md-7 hero-text">
                    <h1 id="course-title"></h1>
                    <p id="course-tagline"></p>
                    <button>Enroll Now</button>
                </div>
                <div class="col-md-5 hero-image">
                    <img id="course-image" src="" alt="Course Image" class="img-fluid">
                </div>
            </div>
        </section>

        <section class="learning-outcomes">
            <h2>What Your Child Will Learn</h2>
            <div id="learning-points" class="grid-layout"></div>
        </section>

        <section class="stats-section" id="stats-section">
        </section>

        <section class="confidence-journey-section" id="confidence-journey-section">
        </section>

        <section class="education-features-section" id="education-features-section">
        </section>

        <section class="left-right-section">
            <div class="left">
                <h2 id="left-right-heading"></h2>
                <p id="left-right-paragraph"></p>
            </div>
            <div class="right">
                <img id="left-right-image" src="" alt="">
            </div>
        </section>

        <section class="parents-review-section" id="parents-review-section">
        </section>

    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/course_details.js"></script>
    <script src="js/nav-script.js"></script>
</body>
</html>
