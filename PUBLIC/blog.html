<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyCubs Blog</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/blog.css">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="css/navbar-footer.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container mt-5">
        <header class="blog-header text-center mb-5">
            <h1>StudyCubs Blog</h1>
            <p>Your source for learning tips, news, and updates.</p>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search for articles...">
            </div>
        </header>

        <section id="blog-listing" class="row">
            <!-- Blog posts will be loaded here dynamically -->
        </section>

        <div class="text-center mt-5">
            <button id="load-more-btn" class="btn btn-primary">Load More</button>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="js/blog.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/nav-script.js"></script>
</body>
</html>
