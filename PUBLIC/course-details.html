<script type="module">

  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC4YZeG_t60GX_9EFfMZ9jFDCsLUHbnbz8",
    authDomain: "studycubs-official.firebaseapp.com",
    projectId: "studycubs-official",
    storageBucket: "studycubs-official.firebasestorage.app",
    messagingSenderId: "328675454729",
    appId: "1:328675454729:web:11ed5ab9607c0e4590edd8",
    measurementId: "G-EWPM4HZ7QP"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const params = new URLSearchParams(window.location.search);
  const courseId = params.get("id") || "financial_planning";

  const SAFE_DEFAULT = {
    name: "Default Course",
    hero: {
      title: "Course <span>Data Missing</span>",
      desc: "Please check your Firestore data",
      image: "https://via.placeholder.com/400x300.png?text=Data+Missing",
    },
    learning_cards: [],
    stats: [],
    levels: [],
    feature_cards: [],
    pricing: {
      heading: "Pricing Info Missing",
      paragraph: "Please update in Firestore",
      price_btn: "Enroll Now",
      image: "https://via.placeholder.com/400x300.png?text=Pricing+Missing",
    },
    testimonials: [],
  };

  function mapToHTML(data, type) {
    if (!data || !Array.isArray(data)) return "";
    switch (type) {
      case "learning_cards":
        return data
          .map(
            (x) => `
          <div class="learning-card ${x.class || ""}">
            <div class="icon">${x.icon || "📘"}</div>
            <h3>${x.title || ""}</h3>
          </div>`
          )
          .join("");
      case "stats":
        return data
          .map(
            (x) => `
          <div class="stat-item">
            <div class="stat-icon">${x.icon || "📈"}</div>
            <h3>${x.count || ""}</h3>
            <p>${x.label || ""}</p>
          </div>`
          )
          .join("");
      case "levels":
        return data
          .map(
            (x) => `
          <div class="level-card ${x.class || ""}">
            <h3>${x.h3 || ""}</h3>
            ${x.details?.map((d) => `<p>${d}</p>`).join("") || ""}
            <button>${x.button || "Learn More"}</button>
          </div>`
          )
          .join("");
      case "feature_cards":
        return data
          .map(
            (f) => `
          <div class="feature-card">
            <div class="icon-circle">
              <img src="${f.icon_url || "https://via.placeholder.com/35"}" alt="">
            </div>
            <h3>${f.title}</h3>
            <ul>${f.list?.map((li) => `<li>${li}</li>`).join("") || ""}</ul>
            <button class="download-btn">Download <span>→</span></button>
          </div>`
          )
          .join("");
      case "testimonials":
        return data
          .map(
            (t) => `
          <div class="testimonial-card">
            <p class="testimonial-text">${t.text}</p>
            <p class="testimonial-name">${t.name}</p>
            <p class="testimonial-role">${t.role}</p>
          </div>`
          )
          .join("");
      default:
        return "";
    }
  }

  function renderCourse(data) {
    const c = { ...SAFE_DEFAULT, ...data };
    document.getElementById("page-title").textContent = c.name;

    document.getElementById("dynamic-content-area").innerHTML = `
      <section class="hero">
        <div class="hero-content">
          <h1>${c.hero.title}</h1>
          <p>${c.hero.desc}</p>
        </div>
        <div class="hero-image">
          <img src="${c.hero.image}" alt="${c.name}">
        </div>
      </section>

      <section class="learning-section">
        <h2>What your child will learn</h2>
        <div class="learning-grid">${mapToHTML(c.learning_cards, "learning_cards")}</div>
      </section>

      <section class="stats-section">
        <div class="stats-container">${mapToHTML(c.stats, "stats")}</div>
      </section>

      <section class="course-levels">
        <h2>Start your confidence boosting journey</h2>
        <div class="levels-container">${mapToHTML(c.levels, "levels")}</div>
      </section>

      <section class="educate-features">
        <h2>Check Out Educate Features Win<br>Any Exam</h2>
        <div class="features-container">${mapToHTML(c.feature_cards, "feature_cards")}</div>
      </section>

      <section class="pricing-section">
        <div class="pricing-content">
          <h2>${c.pricing.heading}</h2>
          <p>${c.pricing.paragraph}</p>
          <div class="pricing-buttons">
            <button class="pricing-btn-primary">${c.pricing.price_btn}</button>
            <button class="pricing-btn-secondary">Download <span>→</span></button>
          </div>
        </div>
        <div class="pricing-image">
          <img src="${c.pricing.image}" alt="">
        </div>
      </section>

      <section class="testimonials-section">
        <h2>Creating A Community Of Life Long Learners.</h2>
        <div class="testimonials-container">${mapToHTML(c.testimonials, "testimonials")}</div>
      </section>
    `;
  }

  function normalizeFirestoreDoc(docData) {
    if (!docData) return null;

    return {
      name: docData.title || docData.name,
      hero: {
        title: docData.title || docData.hero?.title || SAFE_DEFAULT.hero.title,
        desc: docData.tagline || docData.hero?.desc || SAFE_DEFAULT.hero.desc,
        image: docData.image || docData.hero?.image || SAFE_DEFAULT.hero.image,
      },
      learning_cards: docData.learningOutcomes || docData.learning_cards || [],
      stats: docData.stats || [],
      levels: docData.confidenceJourney || docData.levels || [],
      feature_cards: docData.feature_cards || docData.featureCards || [],
      pricing: {
        heading: docData.leftRight?.heading || docData.pricing?.heading || SAFE_DEFAULT.pricing.heading,
        paragraph: docData.leftRight?.paragraph || docData.pricing?.paragraph || SAFE_DEFAULT.pricing.paragraph,
        price_btn: docData.pricing?.price_btn || docData.leftRight?.price_btn || SAFE_DEFAULT.pricing.price_btn,
        image: docData.leftRight?.image || docData.pricing?.image || SAFE_DEFAULT.pricing.image,
      },
      testimonials: docData.testimonials || [],
    };
  }

  async function loadCourse() {
    try {
      const ref = doc(db, "courses", courseId);
      const snap = await getDoc(ref);

      if (snap.exists()) {
        const normalized = normalizeFirestoreDoc(snap.data());
        renderCourse(normalized);
      } else {
        console.warn("Course not found in Firestore, using default");
        renderCourse(SAFE_DEFAULT);
      }
    } catch (err) {
      console.error("Error while loading course:", err);
      renderCourse(SAFE_DEFAULT);
    }
  }

  loadCourse();
</script>
