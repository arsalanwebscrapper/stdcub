<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Loading Course...</title>

  <!-- ✅ Load Bootstrap FIRST -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- ✅ Then your main stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ✅ Navbar isolation to prevent conflicts */
    .navbar,
    .navbar * {
      all: revert;
      box-sizing: border-box;
    }

    .navbar {
      background-color: #fff !important;
      position: sticky;
      top: 0;
      z-index: 9999;
      padding: 0.6rem 1rem;
    }

    .navbar-toggler {
      border: none !important;
      background: transparent !important;
      outline: none !important;
      box-shadow: none !important;
    }

    .navbar-toggler-icon {
      filter: invert(0.3);
    }

    .navbar-collapse {
      text-align: right;
    }

    .nav-link {
      font-weight: 600;
      color: #000 !important;
      transition: color 0.3s ease;
    }

    .nav-link:hover {
      color: #7b4eff !important;
    }

    /* Your existing CSS (unchanged) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Batangas', sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000;
    }

    /* ✅ keep rest of your CSS exactly as before */
  </style>

  <!-- ✅ Firebase Script (unchanged) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC4YZeG_t60GX_9EFfMZ9jFDCsLUHbnbz8",
      authDomain: "studycubs-official.firebaseapp.com",
      projectId: "studycubs-official",
      storageBucket: "studycubs-official.firebasestorage.app",
      messagingSenderId: "328675454729",
      appId: "1:328675454729:web:11ed5ab9607c0e4590edd8",
      measurementId: "G-EWPM4HZ7QP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const courseId = params.get("id") || "financial_planning";

    const SAFE_DEFAULT = {
      name: "Default Course",
      hero: {
        title: "Course <span>Data Missing</span>",
        desc: "Please check your Firestore data",
        image: "https://via.placeholder.com/400x300.png?text=Data+Missing",
      },
      learning_cards: [],
      stats: [],
      levels: [],
      feature_cards: [],
      pricing: {
        heading: "Pricing Info Missing",
        paragraph: "Please update in Firestore",
        price_btn: "Enroll Now",
        image: "https://via.placeholder.com/400x300.png?text=Pricing+Missing",
      },
      testimonials: [],
    };

    function mapToHTML(data, type) {
      if (!data || !Array.isArray(data)) return "";
      switch (type) {
        case "learning_cards":
          return data.map(x => `
            <div class="learning-card ${x.class || ""}">
              <div class="icon">${x.icon || "📘"}</div>
              <h3>${x.title || ""}</h3>
            </div>`).join("");
        case "stats":
          return data.map(x => `
            <div class="stat-item">
              <div class="stat-icon">${x.icon || "📈"}</div>
              <h3>${x.count || ""}</h3>
              <p>${x.label || ""}</p>
            </div>`).join("");
        case "levels":
          return data.map(x => `
            <div class="level-card ${x.class || ""}">
              <h3>${x.h3 || ""}</h3>
              ${x.details?.map(d => `<p>${d}</p>`).join("") || ""}
              <button>${x.button || "Learn More"}</button>
            </div>`).join("");
        case "feature_cards":
          return data.map(f => `
            <div class="feature-card">
              <div class="icon-circle">
                <img src="${f.icon_url || "https://via.placeholder.com/35"}" alt="">
              </div>
              <h3>${f.title}</h3>
              <ul>${f.list?.map(li => `<li>${li}</li>`).join("") || ""}</ul>
              <button class="download-btn">Download <span>→</span></button>
            </div>`).join("");
        case "testimonials":
          return data.map(t => `
            <div class="testimonial-card">
              <p class="testimonial-text">${t.text}</p>
              <p class="testimonial-name">${t.name}</p>
              <p class="testimonial-role">${t.role}</p>
            </div>`).join("");
        default:
          return "";
      }
    }

    function renderCourse(data) {
      const c = { ...SAFE_DEFAULT, ...data };
      document.getElementById("page-title").textContent = c.name;
      document.getElementById("dynamic-content-area").innerHTML = `
        <section class="hero">
          <div class="hero-content">
            <h1>${c.hero.title}</h1>
            <p>${c.hero.desc}</p>
          </div>
          <div class="hero-image">
            <img src="${c.hero.image}" alt="${c.name}">
          </div>
        </section>
        <section class="learning-section">
          <h2>What your child will learn</h2>
          <div class="learning-grid">${mapToHTML(c.learning_cards, "learning_cards")}</div>
        </section>
        <section class="stats-section">
          <div class="stats-container">${mapToHTML(c.stats, "stats")}</div>
        </section>
        <section class="course-levels">
          <h2>Start your confidence boosting journey</h2>
          <div class="levels-container">${mapToHTML(c.levels, "levels")}</div>
        </section>
        <section class="educate-features">
          <h2>Check Out Educate Features Win<br>Any Exam</h2>
          <div class="features-container">${mapToHTML(c.feature_cards, "feature_cards")}</div>
        </section>
        <section class="pricing-section">
          <div class="pricing-content">
            <h2>${c.pricing.heading}</h2>
            <p>${c.pricing.paragraph}</p>
            <div class="pricing-buttons">
              <button class="pricing-btn-primary">${c.pricing.price_btn}</button>
              <button class="pricing-btn-secondary">Download <span>→</span></button>
            </div>
          </div>
          <div class="pricing-image">
            <img src="${c.pricing.image}" alt="">
          </div>
        </section>
        <section class="testimonials-section">
          <h2>Creating A Community Of Life Long Learners.</h2>
          <div class="testimonials-container">${mapToHTML(c.testimonials, "testimonials")}</div>
        </section>`;
    }

    async function loadCourse() {
      try {
        const ref = doc(db, "courses", courseId);
        const snap = await getDoc(ref);
        if (snap.exists()) renderCourse(snap.data());
        else renderCourse(SAFE_DEFAULT);
      } catch (err) {
        console.error("Error while loading course:", err);
        renderCourse(SAFE_DEFAULT);
      }
    }

    loadCourse();
  </script>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main id="dynamic-content-area">
    <h2 style="text-align:center;padding:100px;color:#7b4eff;">Loading Course Data...</h2>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  <script src="nav-script.js"></script>
</body>
</html>
