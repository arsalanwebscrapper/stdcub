<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Your Episode - Voices of Cubs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">Voices of Cubs</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Episodes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="submit.html">Submit Episode</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Submit Your Episode</h1>
        <div class="card">
            <div class="card-body">
                <form id="podcast-form">
                    <div class="mb-3">
                        <label for="studentName" class="form-label">Student Name</label>
                        <input type="text" class="form-control" id="studentName" required>
                    </div>
                    <div class="mb-3">
                        <label for="episodeTitle" class="form-label">Episode Title</label>
                        <input type="text" class="form-control" id="episodeTitle" required>
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" required>
                            <option value="">Select Category</option>
                            <option value="Public Speaking">Public Speaking</option>
                            <option value="Coding">Coding</option>
                            <option value="Finance">Finance</option>
                            <option value="Motivation">Motivation</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Short Description</label>
                        <textarea class="form-control" id="description" rows="3" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Record Audio</label>
                        <button type="button" id="recordButton" class="btn btn-secondary">Record</button>
                        <button type="button" id="stopButton" class="btn btn-secondary" disabled>Stop</button>
                    </div>

                    <div class="mb-3">
                        <label for="audioFile" class="form-label">Or Upload Audio File</label>
                        <input type="file" class="form-control" id="audioFile" accept=".mp3, .wav">
                    </div>
                    <div class="mb-3">
                        <audio id="audioPreview" controls style="width: 100%; display: none;"></audio>
                    </div>

                    <div class="mb-3">
                        <label for="uploadProgress" class="form-label">Upload Progress</label>
                        <div class="progress">
                            <div id="uploadProgressBar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer mt-4 bg-light text-center py-3">
        <p>&copy; 2024 StudyCubs. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
